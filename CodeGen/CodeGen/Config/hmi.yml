# VueOneMapper - native EAE HMI configuration.
#
# THIS FILE IS THE SINGLE SOURCE OF TRUTH FOR HMI PRESENTATION, PROTOCOL AND CAPABILITY DATA.
# CodeGen/CodeGen/Hmi reads exactly the keys below and carries no defaults of its own: a missing
# required value is an ERROR, not a silent fallback, and an unknown key is rejected rather than
# ignored. If a presentation or protocol fact is not here, it does not exist.
#
# What must NOT go in this file: component names, recipe steps, interlock rules, controller
# allocation or anything else that varies with the model. Those come from Control.xml via
# GenerationContext and from the finished syslay.

# Bump only alongside a loader change; an absent or unknown version is rejected.
schemaVersion: 1

policy:
  # There is NO global read-only switch. Every command is decided independently, and only from what
  # the deployed artefacts prove: the HMI contract must carry the output event and its data, the
  # contract must expose feedback that shows acceptance, the event must reach the target through the
  # generated application, and some deployed ECC must actually guard on the value. An unknown
  # capability is DISABLED, never assumed.
  #
  # What to do when a deployed CAT declares an HMI contract no profile matches.
  # fail = abort generation; skip = do not place, record a diagnostic.
  unknownContract: skip
  # Shown on a screen that carries at least one deliberately disabled control.
  unsupportedCommandNotice: >-
    Controls shown greyed are not offered because the deployed controller does not implement them;
    each states its own reason.
  # Operator-facing text for every reason a capability can be withheld. One entry per
  # HmiUnavailableReason member; a missing or unknown key is rejected by the loader.
  noContractNotice: "the deployed CAT ships no HMI contract"
  # Stamped into the staged faceplate where a command call was removed, so the emitted
  # source itself says why the control cannot fire and the validator can find it.
  withheldMarker: "WITHHELD BY MAPPER -"
  # Rendered on any screen carrying a withheld action, in the caption style the
  # reference already uses. The operator sees the reason instead of a dead button.
  withheldHeading: "Unavailable on this build:"
# ---------------------------------------------------------------------------------------------
# Geometry. All values are EAE design units; the work area is the canvas minus the runtime
# navigation bar declared by CanvasesResolutionList.
geometry:
  canvasWidth: 1024
  canvasHeight: 768
  navigationBarHeight: 70
  margin: 16
  gap: 16
  captionHeight: 22
  titleY: 34
  contentTop: 68
  button:
    width: 208
    height: 64
    bottomInset: 10

style:
  canvasBrush: CanvasBrush
  buttonBrush: ButtonFalseBrush
  buttonFont: { family: "HMI Sans Serif", size: 12, bold: false }
  captionFont: { family: BigCanvasTopologyButtonFont }
  buttonTextColor: { r: 255, g: 255, b: 255 }
  captionColor: { r: 0, g: 0, b: 0 }
  emphasisColor: { r: 176, g: 0, b: 0 }

screens:
  # ---------------------------------------------------------------------------------------------
  # The screen FAMILIES, reproducing the July 30 architecture. Each family is a role selector plus a
  # symbol choice; one generic paginating renderer draws them all, so adding a family is a config
  # edit and never new C#.
  #
  #   include  - which roles from the semantic model belong on it. Roles are DERIVED: a component a
  #              process commands is an actuator, one it only observes is a sensor. No CAT names,
  #              no instance names, no state counts.
  #   variant  - the symbol to place for a role, when the family wants something other than the
  #              primary one (the Automatic process tile, the Setup jog canvas).
  #   requires - the capability that makes the family's CONTROLS live. The family is still generated
  #              when unsupported; its controls render disabled with the generated reason. Setup
  #              additionally places only the instances whose own capability passed.
  #   onlySupported - drop an instance from this family when `requires` is unsupported for it.
  families:
    - name: MainScreen
      title: "Main Screen"
      # The overview is the plant's COMMAND surface: the areas/stations that carry mode, cycle and
      # fault-reset, and the processes running on them. Actuators are not repeated here - they have
      # their own family, and drawing each one twice paginated the overview into eight pages.
      include: [station, process]
      variant:
        process: sAutomatic

    - name: ActuatorsScreen
      title: "Actuators Screen"
      include: [actuator, sensor]

    - name: ManualScreen
      title: "Manual Screen"
      include: [process]
      variant:
        process: sManual
      requires: ManualStep

    - name: SetupScreen
      title: "Setup Screen"
      include: [actuator]
      variant:
        actuator: sSetup
      requires: SetupJog
      onlySupported: true

  # A read-only surface for the model data the faceplates cannot show: the generated state
  # legend behind each fixed label, the interlock rules the controller will actually run, and
  # where each instance is allocated. Rendered on the deployed panel, not only in a side file.
  detailName: PlantDetail
  detailTitle: Plant detail
  processDetailName: ProcessDetail
  processDetailTitle: Process detail

  # The FIXED grammar a compiled recipe row is read out in. These are sentence templates and
  # nothing else: every {token} is filled from the model at generation time. No component name,
  # process name, state name, slot, allocation or row ever appears in this file - if one did,
  # the panel would stop following the twin, which is the whole point of generating it.
  recipeText:
    command: "Command {target} to {state}"
    wait: "Wait until {source} is {state}"
    phase: "Phase: {phase}"
    end: "Recipe complete"
    # Shown INSTEAD of a plausible label when a target, slot or state cannot be resolved.
    unresolved: "(unresolved - see the generation report)"

  hubName: MainScreen
protocol:
  statesProfiles:
    - id: twoPosition
      match: { inputEventCarries: [atHome, atWork] }
      labels: ["At Home", "To Work", "At Work", "To Home", "At Home (returned)"]
    - id: threePosition
      match: { inputEventCarries: [atHome, atWork1, atWork2] }
      labels: ["At Home", "To Work 1", "At Work 1", "To Work 2", "At Work 2", "To Home", "At Home (returned)"]
    - id: booleanSensor
      match: { inputEventCarries: [State] }
      labels: ["Off", "On"]

# ---------------------------------------------------------------------------------------------
# Capabilities. Discovery is by contract signature only. Each entry says what output event the
# HMI would need, what data it must carry, and which accepted-state feedback proves the command
# landed. `anyFeedback` means at least one must be present.
capabilities:
  # Each command declares the FULL proof it needs. A capability is offered only when every clause
  # passes; anything unproven is disabled and carries a generated reason naming what was missing.
  #
  #   outputEvent / outputData  - the HMI symbol contract must be able to SEND it. outputData is a
  #                               list of accepted shapes; the widest the contract carries wins, which
  #                               is how a two-position jog is told from a three-position one without
  #                               counting states or reading a CAT name. A command that carries no
  #                               data declares one empty shape.
  #   anyFeedback               - the contract must be able to SHOW it was accepted
  #   needsModeChain            - the generated application must actually deliver it
  #   consumption               - some deployed ECC must GUARD on the value. This is the clause that
  #                               separates "the port exists" from "the controller implements it".
  #                               inType restricts the search to one deployed FB type.
  commands:
    - purpose: ModeSelection
      outputEvent: MCNF
      outputData: [[Mode]]
      anyFeedback: [System_Mode, LL_Mode, LocalMode, ModeCMD]
      needsModeChain: false
      # Every actuator core guards its motion on mode, so selecting a mode genuinely changes plant
      # behaviour. Searched across all deployed types, not one named FB.
      consumption:
        tokens: [mode]
      # The CaS adapter ports the mode command travels on. The component REPORT ring is an adapter
      # chain too, and walking it would conclude that every component on the ring can be put into
      # Setup - including the BX1 covers, whose stationAdptr_in has no source at all. These are EAE
      # adapter port names, i.e. protocol, which is why they are named rather than guessed.
      chainPorts: [AreaAdptr, AreaHMIAdptr, CasAdptr, StationAdaptr, StationHMIAdptr, stationAdptr]

    - purpose: CycleControl
      outputEvent: CTCNF
      outputData: [[CycleType]]
      anyFeedback: [System_Cycle_Type, LL_CycleType, LocalCycleType]
      needsModeChain: false
      # The station cycle state machine acts on the selection (AUTO -> CONTINUOUS/SINGLE/STOP_AT_END).
      consumption:
        tokens: [AreaCycleTypeCmd, StationCycleTypeCmd]

    - purpose: CycleStop
      outputEvent: CTCNF
      outputData: [[CycleType]]
      anyFeedback: [System_Cycle_Type, LL_CycleType, LocalCycleType]
      needsModeChain: false
      # A STOP is only real if the component that RUNS the recipe honours it. The station returning
      # to its AUTO state does not halt a recipe already executing, so the proof is deliberately
      # restricted to the recipe engine.
      consumption:
        inType: ProcessRuntime_Generic_v1
        tokens: [CycleType]

    - purpose: FaultReset
      outputEvent: FRCNF
      outputData: [[]]
      anyFeedback: [LL_Fault_Status, LL_Fault, fault_active, fault_code]
      needsModeChain: false
      consumption:
        tokens: [RESET]

    - purpose: ManualStep
      outputEvent: MREQO
      outputData: [[]]
      alsoRequiresOutputEvent: NSREQO
      anyFeedback: [ManualStepReady, ManualStepComplete]
      needsModeChain: false
      # Manual stepping requires the engine to gate on the mode AND to consume both operator events.
      consumption:
        inType: ProcessRuntime_Generic_v1
        tokens: [Mode, MREQ, NSREQ]

    - purpose: SetupJog
      outputEvent: cmd_event
      outputData:
        - [toWork1, toWork2, toHome]
        - [toWork, toHome]
      anyFeedback: [current_state_to_process, atHome, atWork]
      needsModeChain: true
      # The actuator core guards its jog transitions on the setup request. The two actuator
      # families name the WORK direction differently (toWorkSetup vs toWork1Setup/toWork2Setup),
      # so the home direction is required outright and the work direction is satisfied by
      # whichever the deployed core actually uses - still proof, without naming a CAT.
      consumption:
        tokens: [toHomeSetup]
        anyOf:  [toWorkSetup, toWork1Setup, toWork2Setup]

  # ---------------------------------------------------------------------------------------------
  # OPERATOR ACTIONS. A capability proves the controller honours an EVENT; an action is one PAYLOAD
  # on that event - which is what the operator actually presses. CycleControl and CycleStop share
  # CTCNF and mean opposite things, so the verdict that gates a control has to be per action.
  #
  #   fires        - the exact call the staged faceplate makes, e.g. MCNF(1). This is how an action
  #                  is located in the faceplate source: no control name, no handler name, no symbol
  #                  name is written down, so a renamed button cannot silently escape the gate.
  #   writes       - a tag-bound action instead: the control writes this declared <Output> and the
  #                  carrying event is raised with no code at all.
  #   provedBy     - the capability whose gates prove the controller honours the event
  #   alsoRequires - an extra proof THIS PAYLOAD needs, read from the deployed ECC:
  #                    guard         the condition fragment a transition must be guarded on
  #                    distinctFrom  fails when every such transition also accepts this other
  #                                  fragment - i.e. the payload changes nothing
  #                    interlockedBy fails when any such transition omits this fragment - i.e. the
  #                                  payload can move plant with the interlock bypassed
  actions:
    - id: AutoMode
      label: Automatic mode
      provedBy: ModeSelection
      fires: MCNF(1)
    - id: ManualMode
      label: Manual mode
      provedBy: ModeSelection
      fires: MCNF(2)
      alsoRequires: { guard: "mode = 2", distinctFrom: "mode = 1" }
    - id: SetupMode
      label: Setup mode
      provedBy: ModeSelection
      fires: MCNF(3)
    - id: InitialPosition
      label: Initial position
      provedBy: ModeSelection
      fires: MCNF(9)
      alsoRequires: { guard: "mode = 9", interlockedBy: Interlock }
    # Every cycle selection is proved by the RECIPE ENGINE, not by the station tracking the choice.
    # A station that changes its own cycle state while the engine runs on regardless has accepted a
    # command that does not reach the plant, so all four share the strict proof.
    - id: CycleContinuous
      label: Run continuously
      provedBy: CycleStop
      fires: CTCNF(1)
    - id: CycleStopAtEnd
      label: Stop at end of cycle
      provedBy: CycleStop
      fires: CTCNF(2)
    - id: CycleSingle
      label: Single cycle
      provedBy: CycleStop
      fires: CTCNF(3)
    - id: CycleStopRunning
      label: Stop
      provedBy: CycleStop
      fires: CTCNF(0)
    - id: FaultReset
      label: Fault reset
      provedBy: FaultReset
      writes: Fault_Reset
    - id: ManualExecute
      label: Execute step
      provedBy: ManualStep
      fires: MREQO(true)
    - id: ManualNext
      label: Next step
      provedBy: ManualStep
      fires: NSREQO(true)
    - id: JogHome
      label: Jog home
      provedBy: SetupJog
      writes: toHome
    - id: JogWork
      label: Jog to work
      provedBy: SetupJog
      writes: toWork
    - id: JogWork1
      label: Jog to work 1
      provedBy: SetupJog
      writes: toWork1
    - id: JogWork2
      label: Jog to work 2
      provedBy: SetupJog
      writes: toWork2

  # A pure feedback capability: it commands nothing, so it is judged on feedback alone.
  interlockDiagnostics:
    requiredFeedback: [ActiveSourceID, ActiveBlockedState]

# ---------------------------------------------------------------------------------------------
# Deployment. HMI project registration data that is otherwise embedded in the emitters.
# ---------------------------------------------------------------------------------------------
# The runtime canvas topology written into CanvasesResolutionList.xml. EAE's HMI runtime reads
# this to size the panel, pick the shell canvas and decide which chrome to draw, so it belongs to
# the presentation policy rather than to C#. The work-area height is derived from geometry
# (canvasHeight - navigationBarHeight) and is deliberately NOT restated here.
runtime:
  # The NxtControl schema version the file declares.
  schemaVersion: 1.6.0.0
  # The shell canvas class the runtime starts in, before it navigates to the first work canvas.
  startCanvas: StartCanvas_2
  resolution:
    name:            1024x768
    template:        Default
    resizeBehaviour: Standard
    canvasButtonHeight: 30
  # The second, resolution-independent entry EAE expects to be present.
  fallbackResolution:
    name:            Without resolution
    resizeBehaviour: None
    canvasButtonHeight: 30
    siblingButtonCount: 5
    childButtonCount:   5
  # Runtime chrome. All monitoring affordances - none of them command the plant.
  chrome:
    logger:             true
    login:              true
    currentUser:        true
    languageButton:     true
    runtimeConnection:  true
    navigationBar:      true
    newVersionDeployed: true
    navigationControl:  1

deployment:
  hmiFolderName: HMI
  canvasNamespaceSuffix: Canvases
  symbolNamespaceSuffix: Symbols
  defaultLibraryNamespace: Main
  generatedBanner: "Generated by VueOneMapper from the VueOne model. Do not edit by hand."
  ownershipManifest: .hmi-generated.txt
  primarySymbol: sDefault
  # Symbol families that exist only to command the plant. Never deployed, never registered.

# =================================================================================================
# DEPLOYMENT / DEVICE FACTS
#
# The fixed vendor identities, addresses, ports, filenames and library versions the generated HMI
# panel is deployed with. CodeGen/CodeGen/Hmi holds none of these as literals - a missing or
# malformed value fails before any output is written, naming the exact YAML path.
#
# What must NOT go here: anything the generated project already states authoritatively. The
# solution id comes from IEC61499.dfbproj, the broadcast domain is found by matching this file's
# host address against the emitted BroadcastDomain_*.json, the switch uuid is read from the emitted
# topology equipment, and the active system directory is discovered. Duplicating those would let
# the HMI silently attach to the wrong object.
# =================================================================================================
# ---------------------------------------------------------------------------------------------
# Fixed vendor/platform identities. These are properties of the HMI product being deployed, not
# of any model, so they are stable across every generation. All must be distinct except the two
# that are deliberately the null GUID.
identities:
  # The HMI logical device (HMI_NET). Its id names the emitted .sysdev and binding files.
  device:                 a441cfb6-5523-4d2c-a152-aacecdcef78e
  # The engineering workstation that hosts the panel runtime.
  workstation:            c2d95ca9-038c-4234-94e7-dbd0d2e177d6
  workstationNic:         d31ea8d5-6dbe-4894-9d5d-5b5885b68ccc
  workstationRuntime:     0a062e36-bf86-4578-83af-e7ea841f23ab
  # The Harmony panel and its Soft dPAC container.
  panel:                  25e3cc7c-d98a-486a-963b-c5ab645331c9
  panelRuntime:           3a2ddbd2-8267-4ebb-a73e-6743b3db76aa
  panelContainer:         87e8a4b7-4c64-42cd-aa81-4c610b6e237c
  panelContainerRuntime:  d0643772-7619-49ca-92e1-54a8649dbcac
  # Runtime type discriminators.
  runtimeType:            422ee926-a34a-4ab5-9e8f-dce0782579f0
  containerRuntimeType:   29797a55-a6b8-47c4-9c06-e8a42b1a38b5
  simulationService:      F7C90C9D-BD8B-4D0B-B8DE-C659AF6EABCC
  # The null device id. Deliberately shared by the two RuntimeDEOs that bind no device, so the
  # duplicate-GUID check exempts exactly this key and no other.
  nullDevice:             00000000-0000-0000-0000-000000000000

# ---------------------------------------------------------------------------------------------
# Addressing. hostIp is the workstation NIC; internalRuntimeIp is the panel's Soft dPAC container.
#
# The container address is LOAD-BEARING and must not be moved casually: a Soft dPAC container is a
# macvlan child with its own MAC and is EAE's deploy/login target, so it must own its address
# exclusively. It sits at .3 because .1 is the RevPi host - a post-generation validator fails the
# whole generation on a container collision, which is exactly what a silent revert to .1 produced.
network:
  hostIp:            192.168.1.2
  internalRuntimeIp: 192.168.1.3
  subnet:            192.168.1.0
  # Matches the July 30 reference: Simulation.Binding LogicalPort="61999" and the
  # topology equipment logicalPort/logicalPortSecured pair.
  logicalPort:       61999
  securePort:        51443

# The IEC61499 library reference the HMI project requires.
library:
  name:    SE.Standard
  version: 24.1.0.4

# The logical-device type/name the generated .sysdev must declare, checked after emission.
logicalDevice:
  type: HMI_NET

# ---------------------------------------------------------------------------------------------
# Deployment artefacts. Each entry is one template rendered to one destination; the emitter walks
# this list rather than carrying a WriteTemplate call per file. `into` selects the destination
# root the generator resolves: system (the active System GUID folder), device (the HMI device
# folder) or topology.
artefacts:
  - template: HMI.sysdev.xml
    into:     system
    name:     "{DeviceId}.sysdev"
  - template: Simulation.Binding.xml
    into:     device
    name:     "{DeviceId}.Simulation.Binding.xml"
  - template: Empty.Properties.xml
    into:     device
    name:     E0601B81-4A3A-4A96-B6C2-007BDC680D59.Properties.xml
  - template: Runtime.Properties.xml
    into:     device
    name:     F513CAE3-7194-4086-936C-02912EA0B352.Properties.xml
  - template: Equipment_Workstation_1.json
    into:     topology
    name:     Equipment_Workstation_1.json
    register: topologyProj
  - template: Equipment_HMIP6_1.json
    into:     topology
    name:     Equipment_HMIP6_1.json
    register: topologyProj
  - template: Wire_HMI_to_Switch1.json
    into:     topology
    name:     Wire_HMI_to_Switch1.json
    register: topologyProj

# Which emitted topology equipment the HMI wire attaches to. The uuid is READ from that file, not
# stated here, so the wire can never point at a switch that no longer exists.
switch:
  equipmentFile: Equipment_Switch_1.json
