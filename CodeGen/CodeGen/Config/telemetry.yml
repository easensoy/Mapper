# Telemetry / MQTT connection settings (consumed by CodeGen.Configuration.TelemetrySettings).
# Values match the prior hard-coded defaults exactly, so behaviour is unchanged.

# Wrap each resource MQTT_CONNECTION in the Telemetry_CAT composite (Config/Health structs).
# false -> emit the raw MQTT_CONNECTION FBs instead (one-rebuild revert if EAE still rejects it).
# The composite carries two trivial helper Basic FBs — TelemetryUnpack (Config struct -> 6 scalar
# inputs) and TelemetryPack (6 status outputs -> Health struct) — doing the member split in ST, so
# every connection is whole-struct or scalar-to-scalar.
useTelemetryCat: true

# Broker URL. The scheme (mqtt:// vs mqtts://) is derived from secureTls, not from this string.
brokerUrl: mqtt://192.168.1.50:1883

# false = insecure demo (mqtt://, device "Insecure Application" enabled). true = mqtts:// + TLS.
secureTls: false
caCert: ""
validateCert: 0

# Shared ConnectionID binding key (every resource's MQTT_CONNECTION + embedded MQTT_PUBLISH).
connectionName: SMC

# One connection per resource, because a resource's embedded MQTT_PUBLISH binds to a connection on its
# OWN resource: without one, every publisher there silently drops. Each is brought up by infrastructure
# that resource already has, so no bring-up wire crosses a device.
#
# DECLARATION ORDER IS EMISSION ORDER: these become FBs on the shared canvas in the order written here,
# and an FB's position in the file is part of the artefact.
#
# instance     the FB name on the shared canvas when the Telemetry composite is used
# rawInstance  its name when the raw MQTT_CONNECTION is emitted instead (useTelemetryCat: false)
# client       broker ClientIdentifier -- unique per resource, or mosquitto evicts the duplicates
# drawnAt      roster   = where the layout row for its instance name puts it
#              bandHead = at the head of its target's band, above that station
# broughtUpBy  the resource role whose INITO starts it: area, station, or ringHead (the head of the
#              report ring this resource participates in, for a resource that has no infrastructure of
#              its own). Omitted where the resource's own wiring already brings it up.
connections:
  - plc: BX1
    instance: Telemetry_BX1
    rawInstance: MqttConn
    client: SMC_BX1
    drawnAt: roster
  - plc: M262
    instance: Telemetry_M262
    rawInstance: MqttConn_M262
    client: SMC_M262
    drawnAt: bandHead
    broughtUpBy: area
  - plc: M580
    instance: Telemetry_M580
    rawInstance: MqttConn_M580
    client: SMC_M580
    drawnAt: bandHead
    broughtUpBy: station
  # Emitted only when part of the Feed station is relocated here and its publishers need a local
  # connection alongside the Feed controller's own.
  - plc: RevPi
    instance: Telemetry_RevPi
    rawInstance: MqttConn_RevPi
    client: SMC_RevPi
    drawnAt: bandHead
    broughtUpBy: ringHead

# Publish policy. These were previously C# defaults shadowed by mapper_config.json; telemetry.yml is
# the single owner of every MQTT setting, so they live here with the connection they belong to.
publishEnabled: true
qos: 1
retain: false
topicRoot: smc
