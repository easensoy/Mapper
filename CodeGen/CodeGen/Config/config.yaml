# Global generation constants. Sizes must match the deployed FBT ArraySize patches.
recipeArraySize: 100    # Process1_Generic recipe arrays

# How many reporters one ring can carry. It is the ArraySize of state_table on
# ProcessRuntime_Generic_v1, ProcessStateBusHandler and updateComponentState -- all three are patched
# together, because a report that writes past the end of one of them corrupts the others' memory. The
# plan RAISES this when a model needs more slots; it is never lowered, so existing ids stay put.
stateTableCapacity: 24

# Actuator settle times (ms) written into the syslay when Control.xml gives none.
defaultMotionMs: 2000   # default toWork/toHome
# BX1 cover P&P toWork/toHome. Fault watchdog is 2x this. The covers are sensor-driven across the
# M580->BX1 ring + EtherNet/IP; too small a window faults before AtWork -> stall.
coverMotionMs: 2000
# Centre-home swivel (Bearing_PnP) Home reverse-brake pulse (ms), gated MapperConfig.SwivelBrakeHome.
# At the DI02 centre edge the CAT reverses the driving coil (toward AtWork1, away from the ejector) to
# arrest the home-drive coast, then de-energises. SAFE direction is UP: a longer pulse always errs
# toward AtWork1 / away from the ejector. If the arm rests toward AtWork2, raise; toward AtWork1, lower.
bearingPnpHomeBrakeMs: 160

# EAE holds a generated file open while its editor is on that artefact, so a write can fail with a
# sharing violation that clears on its own. Retry rather than abort the whole generation.
fileWriteRetries: 8

# How often a broker re-reads its coupler word. The BX1 cover IO has no change event of its own -
# a symlink carries a VALUE, not an event - so the broker polls, and this is how fast.
bx1IoScanPeriodMs: 50

# The M262 TM3 bus: cycle time, the tolerance EAE allows before it calls a cycle missed, and what
# it does when one is. Facts about the physical bus, not about the plant on it.
m262BusCycleMs: 80
m262BusCycleTolerance: 30
m262BusCycleActionWhenMissed: 1

# How often a sensor-fitted five-state actuator re-samples its own DIs. Its Inputs symlink is
# sample-on-REQ, so without this nothing re-reads an arrival after the ring goes quiet.
actuatorInputPollMs: 200

# The EAE namespace every type and instance the Mapper emits lives in. A project-identity fact of
# the generated solution, spelled once here rather than at each of the two dozen places that emit a
# Namespace attribute.
projectNamespace: Main

# What the generated application and its one canvas layer are CALLED in the EAE device tree. Names an
# engineer reads, so they are declared here; a Clean BLANKS both, which is how a wiped project is told
# from a generated one.
applicationName: WMG
layerName: SMC_Rig
