# Where the generated FBs are placed on the EAE canvas, and which controller runs each of them.
#
# This is the DEPLOYMENT roster: the twin says what the machine does, this says where each component
# runs and where it is drawn. Adding a component to the rig is a row here, not a change in C#.
#
# ORDER IS LOAD-BEARING, and there are two different orders that must NOT be merged:
#
#   idOrder      assigns the state_table index, the CAT actuator_id and every recipe Wait1Id. Appending
#                is safe; INSERTING renumbers every component after the insert and silently repoints
#                every WAIT that referenced them.
#   casBusOrder  chains the station adapter, interleaving sensors with actuators. Normalising the two
#                into one list would either renumber components or rewire the bus.
#
# Names are Control.xml FB instance names, not hardware aliases: a CAT's $${PATH} symlinks expand to
# them. A component the twin omits is simply skipped by whatever consumes the list.

# Canvas geometry. Actuator CATs render ~1400 wide, so a 1700 pitch leaves a ~300 gap with no overlap.
geometry:
  columnPitchX: 1700
  frameOriginY: 1700
  frameHeight: 5300
  # A device-local sysres canvas (M580/BX1) translates the FBs it hosts so the group's bounding-box
  # top-left lands here. The shared syslay's raw coordinates are global and would put a device-local
  # canvas off-screen. The syslay and the M262 sysres keep the global coordinates and ignore this.
  deviceCanvasOrigin: { x: 2000, y: 2000 }
  # Grown around the FBs each zone frame owns. Left is widest because the ring wires loop out of the
  # FBs' left edges and must stay inside the frame.
  framePadding: { left: 500, top: 220, right: 250, bottom: 260 }
  # Y per row, spaced to clear the EAE-rendered FB body in the row above (Process1_Generic ~800,
  # Five_State ~1400) while keeping the canvas tight.
  rowY:
    Floating: 200
    Hmi: 1200
    Station: 2100
    Process: 2900
    Sensor: 2900
    Actuator: 4100

# One band per controller. frameOriginX is the band's left edge, columnBaseX the X of column 0 (200
# inside the frame), frameWidth the fitted width. Combined with MoveStyle="None" on every Frame, EAE
# renders them at exactly these bounds instead of auto-growing one band around another's FBs.
# RevPi hosts the Feed station in M262's band, so it shares M262's geometry.
bands:
  - plc: M262
    frameOriginX: 1800
    columnBaseX: 2000
    frameWidth: 8500      # 1800..10300
  - plc: RevPi
    frameOriginX: 1800
    columnBaseX: 2000
    frameWidth: 8500
  - plc: M580
    frameOriginX: 10800
    columnBaseX: 11000
    frameWidth: 16000     # 10800..26800
  - plc: BX1
    frameOriginX: 23200
    columnBaseX: 23400
    frameWidth: 6600      # 23200..29800

# Bootstrap FBs: fixed coordinates, no column grid, no controller (the resource owns them). x/y is the
# application canvas, sysresX/sysresY the device-local one. Which type each name carries, and under which
# EAE id, is deployment protocol and lives in TargetBootstrap.
bootFbs:
  - name: FB1            # DPAC_FULLINIT
    x: 3000
    y: 400
    sysresX: 1900
    sysresY: 140
  - name: FB2            # plcStart
    x: 800
    y: 1100
    sysresX: 820
    sysresY: 660

# Per-resource infrastructure. The generic wire emitter learns a resource's shape from here rather than
# from a table of controller names: a role the resource does not declare is simply not planned. label is
# the resource's report tag (M262's must stay "Sysres" -- its file output is byte-identical only under it).
resources:
  - plc: M262
    label: Sysres
    roles: { areaHmi: Area_HMI, area: Area, stationHmi: Station1_HMI, station: Station1, areaTerminator: Area_Term, terminator: Stn1_Term }
  - plc: M580
    label: M580
    roles: { stationHmi: Station2_HMI, station: Station2, terminator: Stn2_Term }
  - plc: BX1
    label: BX1
    roles: {}
  - plc: RevPi
    label: RevPi
    roles: {}

# Adapter wiring between infrastructure roles. Emitted in this order, and only where the resource
# declares both endpoints. Ports are the CAT interface contract, so they stay spelled here beside the
# role that owns them.
resourceRelations:
  - { from: areaHmi,    fromPort: AreaHMIAdptrOUT,    to: area,           toPort: AreaHMIAdptrIN }
  - { from: stationHmi, fromPort: StationHMIAdptrOUT, to: station,        toPort: StationHMIAdptrIN }
  - { from: area,       fromPort: AreaAdptrOUT,       to: station,        toPort: AreaAdptrIN }
  - { from: station,    fromPort: AreaAdptrOUT,       to: areaTerminator, toPort: CasAdptrIN }
  # Not a direct wire: the two ends of the CaS chain the resource's components are threaded onto.
  - { from: station,    fromPort: StationAdaptrOUT,   to: terminator,     toPort: CasAdptrIN, chain: stationAdptr }

# The roster. plc = hosting controller, column/row = canvas position, owner = the Process FB that
# commands it ("" = commanded by none, or across controllers).
components:
  # M262 - Feed Station
  - { name: Area_HMI,        plc: M262, column: 0, row: Hmi,      owner: "" }
  - { name: Station1_HMI,    plc: M262, column: 1, row: Hmi,      owner: "" }
  - { name: Area,            plc: M262, column: 0, row: Station,  owner: "" }
  - { name: Station1,        plc: M262, column: 1, row: Station,  owner: "" }
  - { name: Area_Term,       plc: M262, column: 2, row: Station,  owner: "" }
  - { name: PartInHopper,    plc: M262, column: 0, row: Process,  owner: Feed_Station }
  - { name: PartAtChecker,   plc: M262, column: 1, row: Process,  owner: Feed_Station }
  - { name: Feed_Station,    plc: M262, column: 2, row: Process,  owner: Feed_Station }
  # synth discharge sensor (DI08)
  - { name: PartAtAssembly,  plc: M262, column: 3, row: Sensor,   owner: Feed_Station }
  - { name: Feeder,          plc: M262, column: 0, row: Actuator, owner: Feed_Station }
  - { name: Checker,         plc: M262, column: 1, row: Actuator, owner: Feed_Station }
  - { name: Transfer,        plc: M262, column: 2, row: Actuator, owner: Feed_Station }
  - { name: Ejector,         plc: M262, column: 3, row: Actuator, owner: Feed_Station }
  # UR3e discharge tail, commanded across controllers by Disassembly
  - { name: Robot,           plc: M262, column: 4, row: Actuator, owner: "" }
  - { name: Stn1_Term,       plc: M262, column: 3, row: Station,  owner: "" }

  # M580 - Assembly + Disassembly
  - { name: Station2_HMI,     plc: M580, column: 0, row: Hmi,      owner: "" }
  - { name: Station2,         plc: M580, column: 0, row: Station,  owner: "" }
  - { name: Assembly_Station, plc: M580, column: 0, row: Process,  owner: Assembly_Station }
  - { name: Disassembly,      plc: M580, column: 1, row: Process,  owner: Disassembly }
  - { name: BearingSensor,    plc: M580, column: 2, row: Process,  owner: Assembly_Station }
  - { name: ShaftSensor,      plc: M580, column: 3, row: Process,  owner: Assembly_Station }
  - { name: Bearing_PnP,      plc: M580, column: 0, row: Actuator, owner: Assembly_Station }
  - { name: Bearing_Gripper,  plc: M580, column: 1, row: Actuator, owner: Assembly_Station }
  - { name: Shaft_Hr,         plc: M580, column: 2, row: Actuator, owner: Assembly_Station }
  - { name: Shaft_Vr,         plc: M580, column: 3, row: Actuator, owner: Assembly_Station }
  - { name: Shaft_Gripper,    plc: M580, column: 4, row: Actuator, owner: Assembly_Station }
  - { name: Clamp,            plc: M580, column: 5, row: Actuator, owner: Assembly_Station }
  - { name: Stn2_Term,        plc: M580, column: 6, row: Actuator, owner: "" }

  # BX1 - Cover PnP. The covers fold into the M580 flow, so BX1 runs no Process engine.
  # Both twin spellings of the cover sensor are registered; only the one a model contains is looked up.
  - { name: TopCoverSenosr,   plc: BX1, column: 0, row: Process,  owner: "" }
  - { name: TopCoverSensor,   plc: BX1, column: 0, row: Process,  owner: "" }
  - { name: CoverPNP_Hr,      plc: BX1, column: 0, row: Actuator, owner: "" }
  - { name: CoverPNP_Vr,      plc: BX1, column: 1, row: Actuator, owner: "" }
  - { name: CoverPnp_Gripper, plc: BX1, column: 2, row: Actuator, owner: "" }
  # EtherNet/IP cover-IO broker
  - { name: BX1_IO,           plc: BX1, column: 3, row: Actuator, owner: "" }

  # MQTT lives on BX1 (Soft dPAC); M262/M580 have no MQTT runtime client (RC50).
  - { name: MqttConn,         plc: BX1,  column: 0, row: Floating, owner: "" }
  - { name: MqttConn_M262,    plc: M262, column: 0, row: Floating, owner: "" }
  - { name: MqttConn_M580,    plc: M580, column: 0, row: Floating, owner: "" }
  - { name: Telemetry_M262,   plc: M262, column: 2, row: Hmi,      owner: "" }
  - { name: Telemetry_M580,   plc: M580, column: 1, row: Hmi,      owner: "" }
  - { name: Telemetry_BX1,    plc: BX1,  column: 0, row: Hmi,      owner: "" }

# How much canvas each FB body is assumed to occupy, used only to size the zone frames. Kept ~15-20%
# above the observed EAE render so a MoveStyle="AnyContained" frame still ENCLOSES the body rather
# than growing westward around a neighbour's FBs. Width is uniform; only height varies by type.
# Raise a type only if EAE shows it overflowing. An unlisted type takes defaultHeight.
fbBody:
  width: 1400
  defaultHeight: 1100
  heightByType:
    Five_State_Actuator_CAT: 1800
    Five_State_Actuator_No_Sensors_CAT: 1800
    Vacuum_Gripper_CAT: 1800
    Seven_State_Actuator_CAT: 1500
    Seven_State_Actuator_Centre_Home_CAT: 1800
    Robot_Task_CAT: 1500
    Process1_Generic: 1000
    Sensor_Bool_CAT: 650
    Area: 600
    Station: 600
    Area_CAT: 500
    Station_CAT: 500
    CaSAdptrTerminator: 450
    PLC_RW_M580: 1200
    PLC_RW_BX1: 1200
    PLC_RW_M262: 1200
    DPAC_FULLINIT: 500
    plcStart: 500
    MQTT_CONNECTION: 600
    Telemetry: 800

# Assigns the state_table index / actuator_id / recipe Wait1Id. See the ORDER note at the top.
idOrder:
  sensors:
    - PartInHopper
    - PartAtChecker
    - BearingSensor
    - ShaftSensor
    # Both twin spellings; the absent one is skipped.
    - TopCoverSenosr
    - TopCoverSensor
    # LAST on purpose: appending leaves every existing sensor id untouched. A twin that omits it falls
    # through to the synth injection, so both shapes generate the same ids.
    - PartAtAssembly
  actuators:
    - Feeder
    - Checker
    - Transfer
    - Ejector
    - Bearing_PnP
    - Bearing_Gripper
    - Shaft_Hr
    - Shaft_Vr
    - Shaft_Gripper
    - Clamp
    - CoverPNP_Hr
    - CoverPNP_Vr
    - CoverPnp_Gripper
  # Appended only when the cross-controller discharge is active, so it never shifts the ids above it.
  robotTail:
    - Robot

# Alternate spellings a twin may use for a component the roster already declares. Two names for one
# physical device is a naming fact, not an allocation rule: the alias resolves to the declared component
# and inherits whatever controller it is given.
aliases:
  Rejector: Ejector
  Robot_Pick_And_Place1: Robot
  Disassembly_Station: Disassembly

# Chains the station adapter; interleaves sensors with actuators.
casBusOrder:
  - PartInHopper
  - PartAtChecker
  - Feeder
  - Checker
  - Transfer
  - BearingSensor
  - ShaftSensor
  - Bearing_PnP
  - Bearing_Gripper
  - Shaft_Hr
  - Shaft_Vr
  - Shaft_Gripper
  - Clamp
  - TopCoverSenosr
  - TopCoverSensor
  - CoverPNP_Hr
  - CoverPNP_Vr
  - CoverPnp_Gripper
