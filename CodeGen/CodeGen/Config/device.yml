# Deployment-target device network facts for the SMC Demonstrator.
m262:
  targetIp: 192.168.1.10
  subnetAddress: 192.168.1.0
  subnetMask: 255.255.255.0
  gateway: 192.168.1.254
m580:
  targetIp: 192.168.1.20
bx1:
  targetIp: 192.168.1.151
  hostIp: 192.168.1.209
  # TM3BC EtherNet/IP remote-I/O coupler carrying the covers' physical I/O. The BX1 scanner must
  # list it or cover_hr can neither be commanded nor homed.
  couplerIp: 192.168.1.210
# Revolution Pi (Soft_dPAC) Feed-station host. The two addresses are DIFFERENT ROLES and must never be
# equal — a Docker macvlan child is a separate layer-2 endpoint (its own MAC) from the host it rides on:
#   hostIp   = the RevPi Linux/Docker HOST NIC (eth0). Runs the Soft dPAC Manager on TCP 8080; EAE's
#              "Manage Soft dPAC" talks HERE to create the macvlan, pull the ARM image and start the
#              container. The host never listens on the runtime port.
#   targetIp = the Soft dPAC CONTAINER on that macvlan. This is where the IEC 61499 runtime listens and
#              where EAE Deploy/Login connects. Dead until Manager Apply has created the container.
# targetIp .6 is COMPILER-PROVEN: EAE itself resolved Revolution_Pi.RES0 to nxtv3://192.168.1.6:51300 in
# the reference solution's own CrossComm commdesc output. Do NOT "fix" it to a host address again —
# commit cc8d07f set it to .1 because .6 "timed out" and .1 answered a ping, but .6 was dead only because
# the container had never been created, and a ping to .1 is fully explained by the HMI panel below.
# ⚠ hostIp .1 is PROVISIONAL: it is the only address observed answering as an ARM Linux host with a Soft
# dPAC Manager on 8080, but no project file prescribes it. Confirm it against the MAC address printed on
# the physical RevPi before deploying — this is the one check that cannot be made offline.
revPi:
  targetIp: 192.168.1.6
  hostIp: 192.168.1.1
# The Harmony HMI is NOT configured here. Every HMI deployment fact - addresses, ports, identities,
# artefacts - lives in Config/hmi.yml, its single source of truth, and DeviceConfig no longer
# exposes an Hmi section. Keeping a second copy here is what let the panel container drift back onto
# the RevPi host address (.1) and fail generation on a fatal address collision.
#
# The panel container still matters to THIS file's addressing: it is a macvlan child with its own MAC
# and must not collide with revPi.hostIp. hmi.yml pins it to .3 for exactly that reason.
defaultNetwork:
  subnetAddress: 192.168.0.0
  subnetMask: 255.255.255.0
  gateway: 192.168.0.254
