# Deployment-target device network facts for the SMC Demonstrator.
# A target's own addresses live on its row under `targets:`. They used to live here as well, in a
# section per controller, which is two places to state one fact - and a target added to `targets:`
# silently had no network at all.
defaultNetwork:
  # The broadcast domain every device that is not on a named one binds to. Its uuid is the identity
  # EAE resolves each Equipment's "domain" reference against, so it is declared beside the addresses
  # rather than compiled in - a dangling domain reference makes EAE reject the WHOLE topology.
  domainUuid: 2131fbdd-0a41-4e41-abfb-a14a5ca9218d
  subnetAddress: 192.168.0.0
  subnetMask: 255.255.255.0
  gateway: 192.168.0.254
# BX1 physical I/O profile: the TM3BC EtherNet/IP coupler's word, as the rig wired it. Bit positions are
# fixed by the PLC_RW_BX1 WordToBits/BitsToWork core (index = VALUE = NAME = wiring order). The BX1
# backend derives its broker wires and its cover safe-start from this; it holds no plant names or bit
# numbers of its own.
#
# inputBit 5 is published for BOTH the gripper's grip-detect and the top-cover sensor: it is the only
# cover-present bit the coupler carries. That is a wiring fact, so it is stated once, here.
bx1Io:
  covers:
    - component: CoverPNP_Hr
      event: CoverPnpHrEvent
      sensorFromHome: { signal: CoverPnpHrAtHome, bit: 0 }
      sensorFromWork: { signal: CoverPnpHrAtWork, bit: 1 }
      coilToWork:     { signal: Cover_Pnp_Hr_ToWork, bit: 0 }
      coilToHome:     { signal: Cover_Pnp_Hr_ToHome, bit: 1 }
    - component: CoverPNP_Vr
      event: CoverPnpVrEvent
      sensorFromHome: { signal: CoverPnpVrAtHome, bit: 2 }
      sensorFromWork: { signal: CoverPnpVrAtWork, bit: 3 }
      # Single-acting/spring return: one solenoid, so no ToHome coil is routed.
      coilToWork:     { signal: Cover_Pnp_Vr_Q, bit: 2 }
    - component: CoverPnp_Gripper
      event: CoverSensorEvent
      # One sensor only (gripped); no home sensor exists on the jaw.
      sensorFromWork: { signal: CoverPnpSensor, bit: 5 }
      coilToWork:     { signal: Cover_Gripper_Q, bit: 3 }
  # The cover actuator forced HOME on start so it cannot auto-energise Work into the swivel.
  safeStartComponent: CoverPNP_Hr

# The system FBs every resource boots with, in EMISSION ORDER: the sysres appends them as listed and
# the bring-up wires below name them by role. Shape is deployment protocol and is the same on every
# target, so it is stated once here; only the instance IDs differ, and those are per target below.
# layoutKey names the layout.yml bootFbs row that gives the FB its canvas position.
bootSequence:
  - role: FB1
    type: DPAC_FULLINIT
    namespace: SE.DPAC
    layoutKey: FB1
  - role: FB2
    type: plcStart
    namespace: SE.AppBase
    layoutKey: FB2
    # A list, not a map: these are emitted as child elements and their order is part of the artefact.
    parameters:
      - { name: Prio,  value: "10" }
      - { name: Delay, value: "T#1000ms" }

# The runtime bring-up every resource emits, before any component wire and IN THIS ORDER - the emitted
# order is part of the artefact, so this is a list. Each endpoint is <role>.<PORT>, where the role is one
# the bootSequence above declares or START, the resource's own cold/warm/online-change entry. Naming
# roles rather than instances is what makes this protocol: it does not vary per target, and a role no
# target declares is refused before a plan exists, so before anything is written.
bringUp:
  - { from: START.COLD,         to: FB1.INIT }
  - { from: START.WARM,         to: FB1.INIT }
  - { from: START.ONLINECHANGE, to: FB1.OC_RETRIGGER }
  - { from: FB2.FIRST_INIT,     to: FB2.ACK_FIRST }

# Per-target EAE resource and device identity. These are DEPLOYMENT facts an engineer may edit: renaming
# a resource, or disambiguating two devices that share a Type, is not a code change. What each backend
# DOES -- whether it hosts the Feed station, whether its canvas is device-local -- stays in C# beside the
# emitter that implements it, and nothing here names a CLR type.
#
# resourceName is load-bearing: the authored M580 .hcf symlinks read 'RES0.M580IO.*', and M262's file
# output is byte-identical only under M262_RES.
# Each flag is a fact about the TOPOLOGY the target sits in, which an engineer may edit; what the flag
# selects is backend code that must exist before the target can be named here at all.
#   hostsFeedStation           runs the Feed station, so components upstream of the assembly side land here
#   deviceLocalCanvas          its sysres canvas is device-local, so FBs translate to a local origin
#   receivesRelocatedComponents  receives components moved off another target -> never swept from its sysres
#   opensCoverSeam             hands the cover detour out, so its ring closes across the seam
#   carriesDetouredChain       carries a chain another target commands, so it is open at both ends
#   hcfTemplate                the authored hardware-config file carried verbatim into its device folder
#   bootFbs                    the frozen EAE instance id per bootSequence role. EAE identifies an FB by
#                              its ID, so a deployed resource's boot ids can never be regenerated: a new
#                              one makes EAE treat it as a new instance and strand the old.
# WHICH backend emits a target is its `backendKind`; a kind is registered once in the composition
# root, so a SECOND controller of a kind that already has one is a row here and nothing else.
#
# The order a run DRIVES the backends is declared below, separately from the order the targets are
# read in: a device whose System folder another one creates has to be emitted after it, and that is
# not the order identities and boot ids are read.
backendEmitOrder: [M262, RevPi, M580, BX1]

targets:
  - plc: M262
    # The TM3 bus this device carries, IN BUS ORDER: each module is chained to the one before it, so
    # the order here IS the PreviousItem chain the .hcf declares. These are the modules the rig has;
    # the XML shape they are written into is EAE's schema and stays in the emitter.
    #
    # id is EAE's own 16-hex identity for the module instance - frozen, because changing one makes EAE
    # treat it as a different module and the channel bindings that name it stop resolving.
    # `nest: true` puts the modules after it INSIDE its Items element rather than beside it, which is
    # what makes the bus master a bus rather than a list.
    # `channels` repeats channelProperties once per channel, numbered from 0.
    hardwareModules:
      - name: BMTM3
        id: 9510AF594EA1EDD1
        typeNamespace: SE.IoTMx
        nest: true
        masterConfigFile: '${ProjectDir}\${SystemName}\RuntimeData\${DeviceName}\boot\${busid}.xml'
        itemProperties:
          - { name: busid, value: TM3Config, hwParam: BUS_ID }
          - { name: powerConsumption, value: "0", kind: unsignedByte }
          - { name: buscycletime, value: busCycleTime, kind: declared, hwParam: busCycleTime }
          - { name: buscycletolerance, value: busCycleTolerance, kind: declared, hwParam: busCycleTolerance }
          - { name: buscycleactionwhenmissed, value: busCycleActionWhenMissed, kind: declared, hwParam: busCycleActionWhenMissed }
          - { name: enableSymlinkOC, value: "TRUE", hwParam: enableSymlinkOC }
        parameterValues:
          - { name: busId, value: "'BMTM3'" }
          - { name: enableSymlinkOC, value: "TRUE" }
          - { name: phase, value: T#0ms }
          - { name: busCycleTime, value: busCycleTime, kind: declared }
          - { name: busCycleTolerance, value: busCycleTolerance, kind: declared }
          - { name: busCycleActionWhenMissed, value: busCycleActionWhenMissed, kind: declared }
          - { name: busStatusSymlink, value: "" }
      - name: TM262L01MDESE8T
        id: E2B036F9B0A5B0A4
        typeNamespace: SE.IoTMx
      # The two IO modules the .hcf channel bindings are written onto; pinPrefix says which half of the
      # binding table lands on each.
      - name: TM3DI16_G
        id: 52DB1E4920A80F90
        typeNamespace: SE.IoTMx
        pinPrefix: DI
        itemProperties:
          - { name: OptionalModule, value: "0", kind: unsignedByte }
        channels: 16
        channelProperties:
          - { name: Latch, value: "32", kind: unsignedByte }
          - { name: Filter, value: "4", kind: unsignedByte }
      - name: TM3DQ16T_G
        id: 1256CB09958B4E27
        typeNamespace: SE.IoTMx
        pinPrefix: DO
        itemProperties:
          - { name: OptionalModule, value: "0", kind: unsignedByte }
    backendKind: M262
    # This target's own addresses and, where it has one, the subnet it defines.
    network:
      targetIp: 192.168.1.10
      subnetAddress: 192.168.1.0
      subnetMask: 255.255.255.0
      gateway: 192.168.1.254
    deviceName: M262
    # The identities EAE keys this device on. Frozen: a changed id makes EAE treat the device as a
    # new one, so the .hcf symlinks that name the resource stop resolving and trust is re-prompted.
    identity:
      sysdev: 00000000-0000-0000-0000-000000000002
      resource: 1459BCD12760907D
      equipment: 11111111-2222-3333-4444-000000000010
      runtime: 11111111-2222-3333-4444-000000000030
      runtimeType: b0723d05-50bb-4c15-94a4-d8b5981bcb56
    simulationDeployPort: 51499
    simulationArchivePort: 51496
    resourceName: M262_RES
    deviceType: M262_dPAC
    hcfTemplate: M262IO.hcf
    hostsFeedStation: true
    bootFbs:
      - { role: FB1, id: 593A8F4FDEA0A668 }
      - { role: FB2, id: 3DB1FB0F578E5F1E }

  - plc: M580
    backendKind: M580
    network:
      targetIp: 192.168.1.20
    deviceName: M580
    identity:
      sysdev: 00000000-0000-0000-0000-000000000003
      resource: 3E5C2B7F1A4D6C8E
      equipment: 11111111-2222-3333-4444-000000000040
      runtime: 11111111-2222-3333-4444-000000000041
      runtimeType: 7fd313c7-1da3-4618-9a5d-9ff3596aff7f
      # The physical rack this CPU sits in, its power supply and the CPU itself.
      rack: 11111111-2222-3333-4444-000000000042
      cps: 11111111-2222-3333-4444-000000000043
      cpu: 11111111-2222-3333-4444-000000000044
    simulationDeployPort: 51500
    simulationArchivePort: 51497
    resourceName: RES0
    deviceType: M580_dPAC
    hcfTemplate: M580IO.hcf
    deviceLocalCanvas: true
    opensCoverSeam: true
    bootFbs:
      - { role: FB1, id: 66C40EEF3F39D969 }
      - { role: FB2, id: ACED009B79DFCE69 }

  # BX1 and the RevPi are both Soft_dPAC, so Type alone does not identify either: each carries a name.
  - plc: BX1
    # The EtherNet/IP coupler this device's scanner instantiates, and the HwConfiguration model
    # folders that carry it. EAE compiles the scanner FROM that model, so a missing folder means the
    # scanner exports with no slave and the covers can be neither commanded nor homed.
    etherNetIpDeviceType: TM3BC_Ethe_yYhtt9jWKUOJs
    hwConfigModelFolders: [TM3BC_Ethe_R1C9LFqq0OfJh, TM3BC_Ethe_yYhtt9jWKUOJs]
    backendKind: BX1
    network:
      targetIp: 192.168.1.151
      hostIp: 192.168.1.209
      # TM3BC EtherNet/IP remote-I/O coupler carrying the covers' physical I/O. The BX1 scanner must
      # list it or cover_hr can neither be commanded nor homed.
      couplerIp: 192.168.1.210
    identity:
      sysdev: 00000000-0000-0000-0000-000000000004
      # The DEFAULT only: the BX1 resource id is read from its own .hcf, which is authored against the
      # coupler, and the emitter realigns to whatever that file declares.
      resource: C9F2A4B7E1D3F5A8
      equipment: 49363b74-1a84-46c1-b4cd-93f02374daec      # HMIB1X_1, the panel that hosts the container
      container: 37f5487c-396f-477a-a9ae-9c0476a4f772      # Softdpac_1, the container that runs the app
      runtime: 52c5633b-f50b-4bc4-8fbd-e035bc5dfffa
      runtimeType: 29797a55-a6b8-47c4-9c06-e8a42b1a38b5
      # The EtherNet/IP coupler carrying the cover IO, and the scanner that owns it. The scanner id
      # names the HwConfiguration folder EAE compiles the scanner config out of.
      etherNetIp: 49d2ea8e-3a4f-4ead-add4-ec4ba00d5239
      scanner: 270AFDB7F209BFE8
      # The FB id the .hcf EtherNet/IP LinkNames resolve against: this device's IO broker instance.
      ioBrokerFb: F6C04A4BA6FA8593
      containerDomain: db72f221-ece1-4b82-8132-731ce655044e
    simulationDeployPort: 51501
    simulationArchivePort: 51498
    resourceName: BX1_RES
    deviceType: Soft_dPAC
    deviceName: BX1
    hcfTemplate: BX1IO.hcf
    deviceLocalCanvas: true
    carriesDetouredChain: true
    ioBroker: BX1_IO
    bootFbs:
      - { role: FB1, id: 0FE5E1B2C3D4A5B6 }
      - { role: FB2, id: 1A2B3C4D5E6F7081 }

  - plc: RevPi
    backendKind: RevPi
    # The two addresses are DIFFERENT ROLES and must never be equal - a Docker macvlan child is a
    # separate layer-2 endpoint (its own MAC) from the host it rides on:
    #   hostIp   = the RevPi Linux/Docker HOST NIC (eth0). Runs the Soft dPAC Manager on TCP 8080; EAE's
    #              "Manage Soft dPAC" talks HERE to create the macvlan, pull the ARM image and start the
    #              container. The host never listens on the runtime port.
    #   targetIp = the Soft dPAC CONTAINER on that macvlan. This is where the IEC 61499 runtime listens
    #              and where EAE Deploy/Login connects. Dead until Manager Apply created the container.
    # targetIp .6 is COMPILER-PROVEN: EAE itself resolved Revolution_Pi.RES0 to nxtv3://192.168.1.6:51300
    # in the reference solution's own CrossComm commdesc output. Do NOT "fix" it to a host address again -
    # commit cc8d07f set it to .1 because .6 "timed out" and .1 answered a ping, but .6 was dead only
    # because the container had never been created, and a ping to .1 is explained by the HMI panel.
    # WARNING hostIp .1 is PROVISIONAL: it is the only address observed answering as an ARM Linux host
    # with a Soft dPAC Manager on 8080, but no project file prescribes it. Confirm it against the MAC
    # printed on the physical RevPi before deploying - the one check that cannot be made offline.
    network:
      targetIp: 192.168.1.6
      hostIp: 192.168.1.1
    # Hardware contract, not a free choice: these components' signals are physically read by this
    # target's own Modbus coupler, so hosting ANY Feed component here takes them along. Selecting the
    # rest without them would strand a sensor whose DI no other controller can reach.
    alwaysHosts:
      - PartInHopper
    identity:
      sysdev: 00000000-0000-0000-0000-000000000005
      # No resource id: the RevPi reads its own from the Modbus coupler .hcf it is emitted with.
      equipment: 11111111-2222-3333-4444-000000000050
      nic: 11111111-2222-3333-4444-000000000051
      container: 11111111-2222-3333-4444-000000000052
      runtime: 11111111-2222-3333-4444-000000000053
      runtimeType: 29797a55-a6b8-47c4-9c06-e8a42b1a38b5
      # The SAME domain the BX1 container joins: both Soft dPAC containers sit on the device network.
      containerDomain: db72f221-ece1-4b82-8132-731ce655044e
    simulationDeployPort: 51502
    simulationArchivePort: 51499
    resourceName: RevPi_RES
    deviceType: Soft_dPAC
    deviceName: Revolution_Pi
    hostsFeedStation: true
    # Components move HERE from their home controller while their process stays behind, so its ring
    # is what closes around them. That is relocation, not a detour: the chain is not commanded by
    # another controller, it is the same controller reaching a component that moved.
    receivesRelocatedComponents: true
    ioBroker: RevPI_IO
    bootFbs:
      - { role: FB1, id: 2AF90BCA49743BD3 }
      - { role: FB2, id: 8D2BF4F239038BF7 }

# The EAE libraries the generated project references, with the exact versions this rig is built
# against. ORDER IS THE EMITTED ORDER - DfbprojRegistrar appends in this sequence and the .dfbproj
# is a generated artefact, so reordering these rows moves bytes.
#
# The topology server resolves every Equipment catalogReference against these, and the Hardware
# Configurator resolves every .hcf module type; one missing row fails the whole import rather than
# the one device that needed it. A version is a deployment fact about THIS EAE installation, which
# is why it is declared here rather than compiled in.
libraries:
  - { name: SE.DPAC,                          version: 24.1.0.33 }
  - { name: SE.AppBase,                       version: 24.1.0.21 }
  # SE.IoTMx / SE.IoX80 declare the TM3 / X80 module types the .hcf need.
  - { name: SE.IoTMx,                         version: 24.1.0.19 }
  - { name: SE.IoX80,                         version: 24.1.0.19 }
  - { name: SE.HwCommon,                      version: 24.1.0.19 }
  - { name: SE.FieldDevice,                   version: 24.1.0.31 }
  - { name: SE.IoNet,                         version: 24.1.0.11 }
  - { name: Standard.IoEtherNetIP,            version: 24.1.0.27 }
  - { name: SE.IoATV,                         version: 24.1.0.26 }
  - { name: SE.ModbusGateway,                 version: 24.1.0.17 }
  - { name: Standard.IoModbus,                version: 24.1.0.32 }
  - { name: Standard.IoModbusSlave,           version: 24.1.0.25 }
  - { name: Standard.OPCUAClient,             version: 24.1.0.8 }
  - { name: SE.AppCommonProcess,              version: 24.1.0.21 }
  - { name: SE.AppConveying,                  version: 24.1.0.21 }
  - { name: SE.AppSequence,                   version: 24.1.0.21 }
  - { name: SE.AppStateManagement,            version: 24.1.0.21 }
  - { name: SE.AppLiquidFood,                 version: 24.1.0.21 }
  - { name: SE.AppSingleLinePowerMonitoring,  version: 24.1.0.21 }
  - { name: SE.AppWWW,                        version: 24.1.0.21 }

# Identities that belong to the EAE installation rather than to any one device.
installation:
  # The catalog switch every device is wired to in Physical Views.
  switchEquipment: 11111111-2222-3333-4444-000000000060
  # The two EAE deploy-plugin property files stamped into every system-device folder. Their names ARE
  # plugin GUIDs, so EAE finds them by filename; renaming one silently drops that plugin's settings.
  deployPluginProperties: F513CAE3-7194-4086-936C-02912EA0B352.Properties.xml
  systemDeviceProperties: E0601B81-4A3A-4A96-B6C2-007BDC680D59.Properties.xml
